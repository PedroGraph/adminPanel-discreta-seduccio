<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte Premium - Discreta Seducción</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --bg-gradient: radial-gradient(circle at top left, #1e1b4b, #0f172a);
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Ambient background glow */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--primary);
            filter: blur(150px);
            opacity: 0.2;
            top: 10%;
            left: 10%;
            z-index: -1;
        }

        #chat-app {
            width: 100%;
            max-width: 450px;
            height: 700px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header {
            padding: 24px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 20px;
            box-shadow: 0 8px 16px rgba(99, 102, 241, 0.3);
        }

        .header-text h2 {
            font-size: 18px;
            font-weight: 600;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-dim);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #64748b;
        }

        .online .status-dot {
            background: #10b981;
            box-shadow: 0 0 10px #10b981;
        }

        #messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--glass-border) transparent;
        }

        #messages::-webkit-scrollbar {
            width: 4px;
        }

        #messages::-webkit-scrollbar-thumb {
            background: var(--glass-border);
            border-radius: 10px;
        }

        .message-row {
            display: flex;
            flex-direction: column;
            max-width: 85%;
        }

        .message-row.customer {
            align-self: flex-end;
        }

        .message-row.admin {
            align-self: flex-start;
        }

        .message-row.system {
            align-self: center;
            text-align: center;
        }

        .bubble {
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            position: relative;
        }

        .customer .bubble {
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .admin .bubble {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
        }

        .system .bubble {
            background: none;
            color: var(--text-dim);
            font-size: 12px;
            font-style: italic;
        }

        .msg-meta {
            font-size: 10px;
            color: var(--text-dim);
            margin-top: 4px;
            margin-bottom: 2px;
        }

        .admin .msg-meta {
            margin-left: 4px;
        }

        .customer .msg-meta {
            align-self: flex-end;
            margin-right: 4px;
        }

        #input-area {
            padding: 24px;
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 12px;
            background: rgba(15, 23, 42, 0.5);
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
        }

        input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 12px 16px;
            color: white;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
        }

        button.send-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s;
        }

        button.send-btn:hover:not(:disabled) {
            transform: scale(1.05);
            background: var(--primary-dark);
        }

        button.send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Setup/Onboarding */
        #setup-overlay {
            position: absolute;
            inset: 0;
            background: var(--bg-gradient);
            z-index: 100;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }

        #setup-overlay h1 {
            font-size: 32px;
            margin-bottom: 12px;
            background: linear-gradient(to right, #fff, var(--text-dim));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            margin-top: 32px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .start-chat-btn {
            margin-top: 24px;
            padding: 16px;
            background: var(--primary);
            border: none;
            border-radius: 14px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .start-chat-btn:hover {
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
            transform: translateY(-2px);
        }

        .hidden {
            display: none !important;
        }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            width: fit-content;
            margin-bottom: 16px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: var(--text-dim);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <div id="chat-app">
        <div id="setup-overlay">
            <h1>Hola 👋</h1>
            <p style="color: var(--text-dim)">Estamos listos para ayudarte. ¿Cómo te llamas?</p>

            <div class="input-group">
                <input type="text" id="cust-name" placeholder="Tu nombre" autocomplete="off">
                <input type="email" id="cust-email" placeholder="Email (opcional)" autocomplete="off">
                <button class="start-chat-btn" onclick="startChat()">Comenzar Conversación</button>
            </div>

            <p style="font-size:12px; color: var(--text-dim); margin-top: 40px;">
                Respuesta promedio: <span style="color: var(--primary)">5 minutos</span>
            </p>
        </div>

        <header>
            <div class="header-info">
                <div class="avatar">D</div>
                <div class="header-text">
                    <h2 id="agent-name">Soporte Discreta</h2>
                    <div id="status-container" class="status-badge">
                        <div class="status-dot"></div>
                        <span id="status-text">Conectando...</span>
                    </div>
                </div>
            </div>
            <button onclick="location.reload()"
                style="background:none; border:none; color:var(--text-dim); cursor:pointer;">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                    </path>
                </svg>
            </button>
        </header>

        <div id="messages">
            <!-- Messages go here -->
        </div>

        <div id="typing-container" class="hidden" style="margin-left: 24px;">
            <div class="typing-indicator">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>

        <div id="input-area">
            <input type="text" id="msg-input" placeholder="Escribe un mensaje..." onkeypress="handleKeyPress(event)">
            <button id="send-btn" class="send-btn" onclick="sendMessage()" disabled>
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 20 20">
                    <path
                        d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z">
                    </path>
                </svg>
            </button>
        </div>
    </div>

    <script>
        let ws;
        let conversationId;
        let userName = "";
        const messagesDiv = document.getElementById('messages');
        const statusContainer = document.getElementById('status-container');
        const statusText = document.getElementById('status-text');
        const sendBtn = document.getElementById('send-btn');
        const setupOverlay = document.getElementById('setup-overlay');
        const agentNameDisplay = document.getElementById('agent-name');
        const typingContainer = document.getElementById('typing-container');

        function appendMessage(text, type, sender = "") {
            const row = document.createElement('div');
            row.className = `message-row ${type}`;

            const meta = document.createElement('div');
            meta.className = 'msg-meta';
            const now = new Date();
            meta.textContent = `${sender || (type === 'customer' ? 'Tú' : 'Agente')} • ${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}`;

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;

            row.appendChild(meta);
            row.appendChild(bubble);
            messagesDiv.appendChild(row);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function startChat() {
            userName = document.getElementById('cust-name').value.trim();
            const email = document.getElementById('cust-email').value.trim();

            if (!userName) {
                alert('Por favor dinos tu nombre');
                return;
            }

            ws = new WebSocket('ws://localhost:3000');

            ws.onopen = () => {
                statusContainer.classList.add('online');
                statusText.textContent = 'En línea';
                sendBtn.disabled = false;
                setupOverlay.classList.add('hidden');

                ws.send(JSON.stringify({
                    type: 'customer:start-chat',
                    payload: {
                        customer_name: userName,
                        customer_email: email
                    }
                }));
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                console.log('WS Event:', data);

                switch (data.type) {
                    case 'customer:chat-started':
                        conversationId = data.payload.conversation_id;
                        appendMessage(data.payload.message, 'system');
                        break;
                    case 'chat:claimed':
                        conversationId = data.payload.conversation_id; // Ensure we have ID if claimed
                        agentNameDisplay.textContent = data.payload.admin_name;
                        appendMessage(data.payload.message, 'system');
                        break;
                    case 'chat:message':
                        const type = data.payload.sender_type === 'customer' ? 'customer' : 'admin';
                        appendMessage(data.payload.message, type, data.payload.sender_name);
                        break;
                    case 'chat:typing':
                        if (data.payload.sender_type === 'admin') {
                            if (data.payload.is_typing) typingContainer.classList.remove('hidden');
                            else typingContainer.classList.add('hidden');
                            messagesDiv.scrollTop = messagesDiv.scrollHeight;
                        }
                        break;
                    case 'chat:ended':
                        appendMessage(data.payload.message || 'La sesión ha finalizado', 'system');
                        sendBtn.disabled = true;
                        break;
                    case 'error':
                        appendMessage('Error: ' + data.payload.message, 'system');
                        break;
                }
            };

            ws.onclose = () => {
                statusContainer.classList.remove('online');
                statusText.textContent = 'Desconectado';
                sendBtn.disabled = true;
                appendMessage('Se ha perdido la conexión', 'system');
            };
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
            // Optional: send typing event here
        }

        function sendMessage() {
            const input = document.getElementById('msg-input');
            const msg = input.value.trim();
            if (!msg || !conversationId) return;

            ws.send(JSON.stringify({
                type: 'chat:send-message',
                payload: {
                    conversation_id: conversationId,
                    sender_type: 'customer',
                    sender_name: userName,
                    message: msg
                }
            }));

            input.value = '';
        }
    </script>
</body>

</html>
