version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: admin-backend
    env_file:
      - ./backend/.env  # si tienes variables de entorno
    ports:
      - "3000:3000"      # host:contenedor -> AJUSTA si usas otro puerto
    networks:
      - app-network
    # Si tu backend se conecta a una DB externa en tu host:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: admin-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"        # http://localhost:8080 -> Nginx interno en 80
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
